name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_BUILD_ENV: ${{ secrets.CF_BUILD_ENV }}
      CF_DEV_VARS: ${{ secrets.CF_DEV_VARS }}
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (unit, types, translations)
        run: npm test

      - name: Restore production env files
        run: |
          printf '%s\n' "$CF_BUILD_ENV" > .env.prod
          printf '%s\n' "$CF_DEV_VARS" > .dev.vars

      # Up to three tries: next/font downloads the Google Fonts stylesheet during the build, and a bad answer from
      # Google ("Cannot read properties of null (reading '1')" in next/font's loader) failed a deploy on 2026-11-26.
      - name: Build for Cloudflare Workers
        run: for i in 1 2 3; do npx opennextjs-cloudflare build && exit 0; echo "::warning::build failed (try $i), retrying"; sleep $((i * 20)); done; exit 1

      - name: Deploy to Cloudflare Workers
        # Direct wrangler deploy still uploads .dev.vars as Worker secrets; it skips
        # OpenNext's optional R2 cache prefill, which needs extra token permissions.
        run: OPEN_NEXT_DEPLOY=true npx wrangler deploy

      - name: Smoke test the live site
        run: |
          curl --fail --silent --show-error https://streetquest.remixt.app/api/health
          echo
          curl --fail --silent --show-error --output /dev/null https://streetquest.remixt.app/
          echo "homepage OK"

  # The Iran front door (front/, https://37-32-28-215.sslip.io:8443) is updated after every Cloudflare deploy.
  # Its own job: if the Iran box can't be reached, this goes red but the Cloudflare deploy above stays live.
  # Secrets: RELAY_SSH (root@37.32.28.215), RELAY_SSH_PASSWORD (only if the box takes passwords), FRONT_KEY (the Worker's).
  iran-front:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELAY_SSH: ${{ secrets.RELAY_SSH }}
      RELAY_SSH_PASSWORD: ${{ secrets.RELAY_SSH_PASSWORD }}
      FRONT_KEY: ${{ secrets.FRONT_KEY }}
    steps:
      - name: Check out the app
        if: env.RELAY_SSH != ''
        uses: actions/checkout@v4

      - name: Skip when the secrets aren't set
        if: env.RELAY_SSH == ''
        run: echo "::warning::RELAY_SSH secret not set — the Iran front door was not updated."

      - name: Install expect (password logins)
        if: env.RELAY_SSH != '' && env.RELAY_SSH_PASSWORD != ''
        run: sudo apt-get install -y -qq expect >/dev/null

      - name: Deploy the Iran front door
        if: env.RELAY_SSH != ''
        run: bash scripts/front-deploy.sh

      - name: Smoke test the Iran front door
        if: env.RELAY_SSH != ''
        run: curl --fail --silent --show-error --max-time 30 -k "https://$(echo "${RELAY_SSH#*@}" | tr . -).sslip.io:8443/__front/health"
